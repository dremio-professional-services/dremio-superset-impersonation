# Single-node Dremio for local tests: coordinator (master) and executor in one
# process (image default) plus TLS for the web/REST and Arrow Flight endpoints,
# signed by the local test CA from certs.sh.
paths: {
  local: ${DREMIO_HOME}"/data"
  dist: "file://"${paths.local}"/pdfs"
}

services: {
  coordinator.enabled: true,
  coordinator.master.enabled: true,
  executor.enabled: true,
  flight.use_session_service: true,

  coordinator.web.ssl.enabled: true,
  coordinator.web.ssl.auto-certificate.enabled: false,
  coordinator.web.ssl.keyStoreType: "PKCS12",
  coordinator.web.ssl.keyStore: "/opt/dremio/tls/dremio.p12",
  coordinator.web.ssl.keyStorePassword: "changeit",
  coordinator.web.ssl.keyPassword: "changeit",

  flight.ssl.enabled: true,
  flight.ssl.auto-certificate.enabled: false,
  flight.ssl.keyStoreType: "PKCS12",
  flight.ssl.keyStore: "/opt/dremio/tls/dremio.p12",
  flight.ssl.keyStorePassword: "changeit",
  flight.ssl.keyPassword: "changeit"
}
