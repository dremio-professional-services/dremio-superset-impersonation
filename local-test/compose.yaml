# Local test environment only. Not a production deployment.
#   Dremio:   https://localhost:9047  (TLS, local test CA: .state/superset/ca.pem)
#   Superset: http://localhost:8088
name: dremio-superset-local-test

services:
  certs:
    image: alpine:3.22
    command: ["/bin/sh", "/certs.sh"]
    volumes:
      - ./certs.sh:/certs.sh:ro
      - ./.state:/state

  dremio:
    image: quay.io/dremio/dremio-enterprise:26.1.12
    environment:
      DREMIO_MAX_MEMORY_SIZE_MB: "6144"
    secrets:
      - source: dremio_license
        target: /opt/dremio/license/key
    volumes:
      - ./dremio/dremio.conf:/opt/dremio/conf/dremio.conf:ro
      - ./.state/dremio/dremio.p12:/opt/dremio/tls/dremio.p12:ro
      - dremio-data:/opt/dremio/data
    ports:
      - "127.0.0.1:9047:9047"    # Web UI / REST
      - "127.0.0.1:32010:32010"  # Arrow Flight
    healthcheck:
      test: ["CMD-SHELL", "[ $$(netstat -ltn | grep -cE ':(9047|32010) ') -ge 2 ]"]
      interval: 10s
      retries: 60
    depends_on:
      certs: { condition: service_completed_successfully }

  superset:
    build:
      context: ..
      dockerfile: local-test/superset/Dockerfile
    image: dremio-superset-impersonation/superset:6.1.0-local-test
    command: ["/bin/sh", "-c", "superset db upgrade && superset init && exec /usr/bin/run-server.sh"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY in local-test/.env}
    volumes:
      - ./.state/superset/ca.pem:/run/dremio/ca.pem:ro
      - ./tests:/tests:ro
      - ./scripts:/scripts:ro
      - ./.state/secrets:/state   # generated test credentials (gitignored)
      - superset-home:/app/superset_home
    ports:
      - "127.0.0.1:8088:8088"    # Superset UI
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health >/dev/null"]
      interval: 10s
      retries: 60
    depends_on:
      certs: { condition: service_completed_successfully }

  ui-tests:
    profiles: ["ui-test"]
    build: ./ui_tests
    image: dremio-superset-impersonation/ui-tests:playwright-1.64.1
    environment:
      SUPERSET_URL: http://superset:8088
      DREMIO_URL: https://dremio:9047
    volumes:
      - ./ui_tests:/ui_tests:ro
      - ./.state/secrets:/state
      - ./.state/superset/ca.pem:/run/dremio/ca.pem:ro
      - ./.state/ui-artifacts:/artifacts   # screenshots of every test
    # --tb=short: no function arguments (e.g. PATs) in failure output
    command: ["-v", "--tb=short"]

secrets:
  dremio_license:
    environment: DREMIO_LICENSE

volumes:
  dremio-data:
  superset-home:
